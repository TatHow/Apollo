name: Build Windows installer

on:
  push:
  workflow_dispatch:

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Official MSVC-built Node.js (MSYS2's nodejs crashes, see docs/building.md)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-ninja

      - name: Show library versions
        run: pacman -Q mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-boost mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-gcc | tr '\n' ' ' | xargs -0 -I{} echo "::notice title=Library versions::{}"

      # The repo only carries the SudoVDA .inf/.cat/.cer; the driver binary
      # (SudoVDA.dll) and its installer tool (nefconc.exe) are not in git, so
      # without this the virtual display driver never gets installed. Take the
      # signed driver files from the official Apollo release installer.
      - name: Fetch SudoVDA driver binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p upstream && cd upstream
          TAG=$(gh release list --repo ClassicOldSong/Apollo --exclude-drafts --limit 20 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease | not)][0].tagName')
          echo "Using upstream Apollo release $TAG"
          gh release download "$TAG" --repo ClassicOldSong/Apollo --pattern "*.exe" --clobber
          ls -l
          7z x -y -oextracted ./*.exe > /dev/null
          DLL=$(find extracted -iname 'SudoVDA.dll' | head -n 1)
          NEF=$(find extracted -iname 'nefconc.exe' | head -n 1)
          if [ -z "$DLL" ] || [ -z "$NEF" ]; then
            find extracted -ipath '*sudovda*' | head -n 40
            echo "::error title=SudoVDA::Could not find SudoVDA.dll / nefconc.exe in upstream $TAG"
            exit 1
          fi
          SRC=$(dirname "$DLL")
          DEST=../src_assets/windows/drivers/sudovda
          # Use the upstream driver folder as a set so the catalog matches the dll
          for f in "$SRC"/*; do
            case "$(basename "$f")" in
              install.bat|uninstall.bat) ;;   # keep ours
              *) cp -f "$f" "$DEST/" ;;
            esac
          done
          cp -f "$NEF" "$DEST/"
          echo "::notice title=SudoVDA::Bundled driver from upstream $TAG: $(ls "$DEST" | tr '\n' ' ')"

      - name: Configure
        run: |
          set -o pipefail
          which node npm
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF 2>&1 | tee ci-step.log

      - name: Build
        run: |
          set -o pipefail
          ninja -C build 2>&1 | tee ci-step.log

      - name: Package
        run: |
          set -o pipefail
          {
          cpack -G NSIS --config ./build/CPackConfig.cmake
          cpack -G ZIP --config ./build/CPackConfig.cmake
          ls -l build/cpack_artifacts
          } 2>&1 | tee ci-step.log

      # Surface the tail of the failing step as an annotation (readable via the API)
      - name: Report failure
        if: failure()
        run: |
          if [ -f ci-step.log ]; then
            # Compiler errors first (with a little context), long command lines trimmed
            errs=$(grep -n -E "error:|Error |FAILED:" ci-step.log | head -n 1 | cut -d: -f1)
            if [ -n "$errs" ]; then
              sel=$(grep -E -A6 "error:|Error " ci-step.log | grep -v "^D:.*c++.exe" | head -n 80)
            else
              sel=$(grep -v '^\s*$' ci-step.log | tail -n 60)
            fi
            msg=$(echo "$sel" | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failing step output::${msg}"
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Fold-windows
          path: |
            build/cpack_artifacts/*.exe
            build/cpack_artifacts/*.zip
          if-no-files-found: error

      # Rolling pre-release so the latest installer has a direct download link
      - name: Publish pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/fold'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=fold-latest
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" build/cpack_artifacts/*.exe build/cpack_artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Apollo Fold (latest build)" \
            --notes "Automatic build of the fold branch at ${GITHUB_SHA::7}. Run the .exe installer on your Windows host."
